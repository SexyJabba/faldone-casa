<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="ecosistema"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f4f3ee"/><text x="42" y="44" font-family="Arial,sans-serif" font-size="11" fill="#2b7968" font-weight="600" text-anchor="start">FALDONE 4.4  /  ATLANTE</text><text x="42" y="88" font-family="Arial,sans-serif" font-size="30" fill="#193c3f" font-weight="600" text-anchor="start">Sei mondi autonomi. Un ecosistema condiviso.</text><text x="42" y="118" font-family="Arial,sans-serif" font-size="13" fill="#657b78" font-weight="400" text-anchor="start">Ogni ramo mantiene identità, dati e funzioni locali; le interfacce permettono la collaborazione.</text><line x1="42" y1="720" x2="1158" y2="720" stroke="#cbd6cc" stroke-width="1"/><text x="42" y="740" font-family="Arial,sans-serif" font-size="10" fill="#657b78" font-weight="400" text-anchor="start">Casa · Sala server · Laboratorio · Vito · Servizi · Territorio</text><text x="970" y="740" font-family="Arial,sans-serif" font-size="10" fill="#657b78" font-weight="400" text-anchor="start">Schema funzionale / non in scala</text><line x1="220" y1="310" x2="600" y2="410" stroke="#cbd6cc" stroke-width="2"/><line x1="600" y1="310" x2="600" y2="410" stroke="#cbd6cc" stroke-width="2"/><line x1="980" y1="310" x2="600" y2="410" stroke="#cbd6cc" stroke-width="2"/><line x1="220" y1="590" x2="600" y2="410" stroke="#cbd6cc" stroke-width="2"/><line x1="600" y1="590" x2="600" y2="410" stroke="#cbd6cc" stroke-width="2"/><line x1="980" y1="590" x2="600" y2="410" stroke="#cbd6cc" stroke-width="2"/><rect x="410" y="359" width="380" height="78" rx="12" fill="#193c3f"/><text x="600" y="391" font-family="Arial,sans-serif" font-size="16" fill="#edf2e2" font-weight="600" text-anchor="middle">IDENTITÀ · API · DATI · COPIE</text><text x="600" y="416" font-family="Arial,sans-serif" font-size="12" fill="#bfd3c5" font-weight="400" text-anchor="middle">Connessioni selettive, nessuna fusione delle reti</text><a href="#world-vito" target="_parent"><rect x="60" y="180" width="320" height="150" rx="12" fill="#fffefa" stroke="#cbd6cc"/></a><text x="78" y="205" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">01 / BORDO</text><text x="78" y="231" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Vito</text><text x="78" y="257" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Laboratorio mobile e camper</text><text x="78" y="276" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Energia e rete proprie</text><text x="78" y="295" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Documenti e funzioni offline</text><a href="#world-home" target="_parent"><rect x="440" y="180" width="320" height="150" rx="12" fill="#fffefa" stroke="#cbd6cc"/></a><text x="458" y="205" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">02 / AMBIENTI</text><text x="458" y="231" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Casa e domotica</text><text x="458" y="257" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Automazioni per ogni ambiente</text><text x="458" y="276" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Casa, camper, azienda agricola</text><text x="458" y="295" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Comandi locali e supervisione</text><a href="#world-server" target="_parent"><rect x="820" y="180" width="320" height="150" rx="12" fill="#fffefa" stroke="#cbd6cc"/></a><text x="838" y="205" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">03 / CALCOLO</text><text x="838" y="231" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Sala server</text><text x="838" y="257" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Servizi, storage e inferenza</text><text x="838" y="276" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Nucleo stabile + host a richiesta</text><text x="838" y="295" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Trasferibile tra sedi</text><a href="#world-lab" target="_parent"><rect x="60" y="460" width="320" height="150" rx="12" fill="#fffefa" stroke="#cbd6cc"/></a><text x="78" y="485" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">04 / ATTIVITÀ</text><text x="78" y="511" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Laboratorio</text><text x="78" y="537" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Regia del lavoro e dei progetti</text><text x="78" y="556" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Postazioni, strumenti, registri</text><text x="78" y="575" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Indipendente dalla stanza</text><a href="#world-guests" target="_parent"><rect x="440" y="460" width="320" height="150" rx="12" fill="#fffefa" stroke="#cbd6cc"/></a><text x="458" y="485" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">05 / PERSONE</text><text x="458" y="511" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Servizi a terzi</text><text x="458" y="537" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Identità e quote individuali</text><text x="458" y="556" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Catalogo M6 e risorse autorizzate</text><text x="458" y="575" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Client remoti senza ponte LAN</text><a href="#world-reuse" target="_parent"><rect x="820" y="460" width="320" height="150" rx="12" fill="#fffefa" stroke="#cbd6cc"/></a><text x="838" y="485" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">06 / RISORSE</text><text x="838" y="511" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Inventario e comunità</text><text x="838" y="537" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Ricambi, kit e nodi federati</text><text x="838" y="556" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Valore economico del materiale</text><text x="838" y="575" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Riuso o cessione, senza duplicazioni</text><text x="600" y="672" font-family="Arial,sans-serif" font-size="13" fill="#2b7968" font-weight="600" text-anchor="middle">TERRITORIO / Il campo dietro casa estende domotica, lavoro sul posto e supervisione.</text></svg>