<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="campo"><rect x="0" y="0" width="1200" height="850" rx="0" fill="#f2f4f7"/><text x="42" y="44" font-family="Arial,sans-serif" font-size="11" fill="#0076ce" font-weight="600" text-anchor="start">FALDONE 4.4  /  ATLANTE</text><text x="42" y="88" font-family="Arial,sans-serif" font-size="30" fill="#0b2239" font-weight="600" text-anchor="start">Il campo dietro casa: un’estensione per ambienti.</text><text x="42" y="118" font-family="Arial,sans-serif" font-size="13" fill="#5f6b78" font-weight="400" text-anchor="start">Scenario di evoluzione verso attività agricole. Schema funzionale, senza geometria o impianti presunti.</text><line x1="42" y1="810" x2="1158" y2="810" stroke="#d0d7de" stroke-width="1"/><text x="42" y="830" font-family="Arial,sans-serif" font-size="10" fill="#5f6b78" font-weight="400" text-anchor="start">Casa · Sala server · Laboratorio · Vito · Servizi · Territorio</text><text x="970" y="830" font-family="Arial,sans-serif" font-size="10" fill="#5f6b78" font-weight="400" text-anchor="start">Schema funzionale / non in scala</text><rect x="42" y="170" width="700" height="560" rx="16" fill="#e3eef9" stroke="#d0d7de"/><line x1="78" y1="210" x2="710" y2="210" stroke="#bcd6ee" stroke-width="12"/><line x1="78" y1="272" x2="710" y2="272" stroke="#bcd6ee" stroke-width="12"/><line x1="78" y1="334" x2="710" y2="334" stroke="#bcd6ee" stroke-width="12"/><line x1="78" y1="396" x2="710" y2="396" stroke="#bcd6ee" stroke-width="12"/><line x1="78" y1="458" x2="710" y2="458" stroke="#bcd6ee" stroke-width="12"/><line x1="78" y1="520" x2="710" y2="520" stroke="#bcd6ee" stroke-width="12"/><line x1="78" y1="582" x2="710" y2="582" stroke="#bcd6ee" stroke-width="12"/><line x1="78" y1="644" x2="710" y2="644" stroke="#bcd6ee" stroke-width="12"/><rect x="85" y="207" width="285" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="103" y="232" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">AMBIENTE / CAMPO</text><text x="103" y="258" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Controllo locale</text><text x="103" y="284" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Sensori per zone e acqua</text><text x="103" y="303" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Automazioni con limiti locali</text><text x="103" y="322" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Comandi manuali disponibili</text><rect x="414" y="207" width="285" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="432" y="232" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">LAVORO SUL POSTO</text><text x="432" y="258" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Vito laboratorio mobile</text><text x="432" y="284" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Raccolta evidenze e rapporti</text><text x="432" y="303" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Manuali, sopralluoghi, interventi</text><text x="432" y="322" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Sessioni anche senza copertura</text><rect x="85" y="470" width="614" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="103" y="495" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">DATI E RESPONSABILITÀ</text><text x="103" y="521" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Un dominio distinto dalla casa</text><text x="103" y="547" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Identificativo di ambiente e zona; storici separati</text><text x="103" y="566" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Connettività estende la supervisione, non sostituisce il controllo</text><text x="103" y="585" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Nessuna superficie, irrigazione o sensoristica già installata presunta</text><line x1="742" y1="265" x2="800" y2="265" stroke="#0076ce" stroke-width="2" stroke-dasharray="6 5"/><line x1="742" y1="465" x2="800" y2="465" stroke="#0076ce" stroke-width="2" stroke-dasharray="6 5"/><line x1="742" y1="665" x2="800" y2="665" stroke="#0076ce" stroke-width="2" stroke-dasharray="6 5"/><rect x="800" y="190" width="350" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="818" y="215" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">CASA / DOMOTICA</text><text x="818" y="241" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Regia multiambiente</text><text x="818" y="267" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Casa, campo, camper come domini</text><text x="818" y="286" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Dashboard e allarmi per contesto</text><text x="818" y="305" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Nessun ponte libero tra reti</text><rect x="800" y="390" width="350" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="818" y="415" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">LABORATORIO</text><text x="818" y="441" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Centro gestionale</text><text x="818" y="467" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Attività, scorte, manutenzioni</text><text x="818" y="486" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Registri condivisi e supervisione</text><text x="818" y="505" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Nuove attività con dati separati</text><rect x="800" y="590" width="350" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="818" y="615" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">SALA SERVER</text><text x="818" y="641" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Archivi e analisi</text><text x="818" y="667" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Storici, fotografie, backup</text><text x="818" y="686" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Elaborazioni su richiesta</text><text x="818" y="705" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Servizi disponibili da altre sedi</text></svg>