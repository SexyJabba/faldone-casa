<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="vito-modi"><rect x="0" y="0" width="1200" height="850" rx="0" fill="#f4f3ee"/><text x="42" y="44" font-family="Arial,sans-serif" font-size="11" fill="#2b7968" font-weight="600" text-anchor="start">FALDONE 4.4  /  ATLANTE</text><text x="42" y="88" font-family="Arial,sans-serif" font-size="30" fill="#193c3f" font-weight="600" text-anchor="start">Vito: due modalità, una base autonoma.</text><text x="42" y="118" font-family="Arial,sans-serif" font-size="13" fill="#657b78" font-weight="400" text-anchor="start">C1, documenti locali, rete di bordo ed energia servizi costituiscono la base comune.</text><line x1="42" y1="810" x2="1158" y2="810" stroke="#cbd6cc" stroke-width="1"/><text x="42" y="830" font-family="Arial,sans-serif" font-size="10" fill="#657b78" font-weight="400" text-anchor="start">Casa · Sala server · Laboratorio · Vito · Servizi · Territorio</text><text x="970" y="830" font-family="Arial,sans-serif" font-size="10" fill="#657b78" font-weight="400" text-anchor="start">Schema funzionale / non in scala</text><rect x="42" y="160" width="536" height="250" rx="12" fill="#dfead9" stroke="#cbd6cc"/><text x="60" y="185" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">MODALITÀ 01</text><text x="60" y="211" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Laboratorio mobile</text><text x="60" y="237" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Cantiere / intervento / attività sul campo</text><text x="60" y="256" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Consultazione documenti, manuali e agenda</text><text x="60" y="275" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Raccolta ore, materiali, foto e note vocali</text><text x="60" y="294" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Bozza locale → revisione → registro condiviso</text><text x="60" y="313" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Strumenti e diagnostica con profilo dedicato</text><text x="60" y="332" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Nessuna dipendenza obbligatoria dalla sala server</text><rect x="622" y="160" width="536" height="250" rx="12" fill="#e8e3d2" stroke="#cbd6cc"/><text x="640" y="185" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">MODALITÀ 02</text><text x="640" y="211" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Camper / piccola casa</text><text x="640" y="237" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Sosta / viaggio / autonomia locale</text><text x="640" y="256" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Dashboard di bordo e documenti di viaggio</text><text x="640" y="275" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Automazioni del solo ambiente Vito</text><text x="640" y="294" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Contenuti disponibili anche senza Internet</text><text x="640" y="313" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Energia, rete e dati separati dall’avviamento</text><text x="640" y="332" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">La gestione multiambiente non annulla quella locale</text><line x1="310" y1="410" x2="310" y2="450" stroke="#2b7968" stroke-width="2"/><line x1="890" y1="410" x2="890" y2="450" stroke="#2b7968" stroke-width="2"/><line x1="310" y1="450" x2="890" y2="450" stroke="#2b7968" stroke-width="2"/><line x1="600" y1="450" x2="600" y2="480" stroke="#2b7968" stroke-width="2"/><rect x="220" y="480" width="760" height="122" rx="12" fill="#fffefa" stroke="#cbd6cc"/><text x="238" y="505" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">BASE COMUNE</text><text x="238" y="531" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">C1 + rete + energia + archivio locale</text><text x="238" y="557" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Dell 7070 Ultra · i5-8265U · 8 GB · PC e display a sessione</text><text x="238" y="576" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">LTE dedicata; bozze persistenti; riserva energia con arresto ordinato</text><line x1="600" y1="602" x2="220" y2="638" stroke="#657b78" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="60" y="640" width="320" height="110" rx="12" fill="#fffefa" stroke="#cbd6cc"/><text x="78" y="665" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">INTERFACCIA SELETTIVA</text><text x="78" y="691" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Casa e domotica</text><text x="78" y="717" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Supervisione per ambienti</text><text x="78" y="736" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Sincronizzazione al ritorno della rete</text><line x1="600" y1="602" x2="600" y2="638" stroke="#657b78" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="440" y="640" width="320" height="110" rx="12" fill="#fffefa" stroke="#cbd6cc"/><text x="458" y="665" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">INTERFACCIA SELETTIVA</text><text x="458" y="691" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Laboratorio</text><text x="458" y="717" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Registri e progetti condivisi</text><text x="458" y="736" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Sincronizzazione al ritorno della rete</text><line x1="600" y1="602" x2="980" y2="638" stroke="#657b78" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="820" y="640" width="320" height="110" rx="12" fill="#fffefa" stroke="#cbd6cc"/><text x="838" y="665" font-family="Arial,sans-serif" font-size="10" fill="#2b7968" font-weight="600" text-anchor="start">INTERFACCIA SELETTIVA</text><text x="838" y="691" font-family="Arial,sans-serif" font-size="18" fill="#193c3f" font-weight="600" text-anchor="start">Sala server</text><text x="838" y="717" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Archivio, copie e calcolo remoto</text><text x="838" y="736" font-family="Arial,sans-serif" font-size="12" fill="#657b78" font-weight="400" text-anchor="start">Sincronizzazione al ritorno della rete</text></svg>