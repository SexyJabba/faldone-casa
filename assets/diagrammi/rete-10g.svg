t="600" text-anchor="start">Storage e backup</text><text x="651" y="242" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">SFP+ integrata / porta 1</text><text x="651" y="261" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">10 GbE / SFP+ 51</text><line x1="768" y1="280" x2="768" y2="306" stroke="#0076ce" stroke-width="3"/><line x1="768" y1="306" x2="635" y2="306" stroke="#0076ce" stroke-width="3"/><line x1="635" y1="306" x2="635" y2="330" stroke="#0076ce" stroke-width="3"/><a href="#node/M6" target="_parent"><rect x="927" y="165" width="270" height="115" rx="12" fill="#ffffff" stroke="#d0d7de"/></a><text x="945" y="190" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">M6</text><text x="945" y="216" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Media e terzi</text><text x="945" y="242" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">MNPA19-XTR</text><text x="945" y="261" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">10 GbE / SFP+ 52</text><line x1="1062" y1="280" x2="1062" y2="306" stroke="#0076ce" stroke-width="3"/><line x1="1062" y1="306" x2="715" y2="306" stroke="#0076ce" stroke-width="3"/><line x1="715" y1="306" x2="715" y2="330" stroke="#0076ce" stroke-width="3"/><rect x="65" y="505" width="310" height="118" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="83" y="530" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">M1 / FIREWALL</text><text x="83" y="556" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">WAN, VPN e VLAN</text><text x="83" y="582" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">I226-T4 → rame swi