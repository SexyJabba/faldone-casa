<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="rete-10g"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f2f4f7"/><text x="42" y="44" font-family="Arial,sans-serif" font-size="11" fill="#0076ce" font-weight="600" text-anchor="start">FALDONE 4.4  /  ATLANTE</text><text x="42" y="88" font-family="Arial,sans-serif" font-size="30" fill="#0b2239" font-weight="600" text-anchor="start">Una dorsale a 10 GbE, quattro nodi collegati.</text><text x="42" y="118" font-family="Arial,sans-serif" font-size="13" fill="#5f6b78" font-weight="400" text-anchor="start">LGS352C-EU: 48 porte RJ45 da 1 GbE + 4 uplink SFP+ da 10 GbE; modello senza PoE.</text><line x1="42" y1="720" x2="1158" y2="720" stroke="#d0d7de" stroke-width="1"/><text x="42" y="740" font-family="Arial,sans-serif" font-size="10" fill="#5f6b78" font-weight="400" text-anchor="start">Casa · Sala server · Laboratorio · Vito · Servizi · Territorio</text><text x="970" y="740" font-family="Arial,sans-serif" font-size="10" fill="#5f6b78" font-weight="400" text-anchor="start">Schema funzionale / non in scala</text><rect x="390" y="330" width="420" height="124" rx="12" fill="#e3eef9" stroke="#d0d7de"/><text x="408" y="355" font-family="Arial,sans-serif" font-size="10" fill="#0076ce" font-weight="600" text-anchor="start">SWITCH FIDATO</text><text x="408" y="381" font-family="Arial,sans-serif" font-size="18" fill="#0b2239" font-weight="600" text-anchor="start">Linksys LGS352C-EU</text><text x="408" y="407" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">802.1Q · 176 Gbit/s capacità di switching</text><text x="408" y="426" font-family="Arial,sans-serif" font-size="12" fill="#5f6b78" font-weight="400" text-anchor="start">Porte 49–52: dorsale server a stella</text><a href="#node/M2" target="_parent"><rect x="45" y="165" width="270" height="115" rx="12" fill="#ffffff" stroke="#d0d7de"/></a><text x="63" y="190" font-family="Arial,sans-seri